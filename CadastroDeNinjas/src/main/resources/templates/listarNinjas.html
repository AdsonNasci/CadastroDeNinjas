<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tabela de ninjas</title>
</head>
<body>
    <h1>Lista de Ninjas</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>imagem</th>
                <th>nome</th>
                <th>idade</th>
                <th>email</th>
                <th>rank</th>
                <th>missoes</th>
            </tr>
        </thead>
        <tbody>
        <tr th:each  = "ninja: ${ninjas}">
            <td><img th:src="${ninja.img_url}"></td>
            <td th:text="${ninja.id}"></td>
            <td th:text="${ninja.nome}"></td>
            <td th:text="${ninja.idade}"></td>
            <td th:text="${ninja.email}"></td>
            <td th:text="${ninja.rank}"></td>
            <td th:text="${ninja.missoes}"></td>

            <td>
                <a>Ver detalhes</a>
                <a>Alterar</a>
                <a th:href="@{/ninjas/ui/deletar/{id}{id=${ninja.id}}">Deletar</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
